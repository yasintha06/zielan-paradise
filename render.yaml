services:
  - type: web
    name: zeilan-backend
    env: python
    repo: https://github.com/yasintha06/zielan-paradise
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: MONGO_URI
        fromSecret: MONGO_URI
      - key: JWT_SECRET_KEY
        fromSecret: JWT_SECRET_KEY
    domains:
      - zeilanparadise.com
      - www.zeilanparadise.com

<header class="zp-nav" [class.is-solid]="solid()" [class.is-hidden]="hidden() && !menuOpen()" [class.menu-open]="menuOpen()">
  <div class="zp-nav-inner">
    <a routerLink="/" class="zp-nav-logo" aria-label="Zeilan Paradise home">
      <img src="logo-light.png" alt="Zeilan Paradise" width="400" height="341" />
    </a>

    <nav class="zp-nav-links" aria-label="Main navigation">
      @for (link of links; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: link.path === '/' }">
          <span class="zp-roll"><span class="zp-roll-in" [attr.data-text]="link.label">{{ link.label }}</span></span>
        </a>
      }
    </nav>

    <div class="zp-nav-right">
      <a [href]="site.phoneHref" class="zp-nav-phone" aria-label="Call us">{{ site.phoneDisplay }}</a>
      <a routerLink="/tailor-made" class="btn btn-gold btn-sm zp-nav-cta" appMagnetic>Plan My Journey</a>
      <button class="zp-burger" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-controls="zp-menu"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
        <span></span><span></span>
      </button>
    </div>
  </div>
</header>

<div id="zp-menu" class="zp-menu" [class.is-open]="menuOpen()" [attr.aria-hidden]="!menuOpen()" [attr.inert]="menuOpen() ? null : ''">
  <div class="zp-menu-bg"></div>
  <div class="zp-menu-content">
    <nav class="zp-menu-links" aria-label="Mobile navigation">
      @for (link of menuLinks; track link.path; let i = $index) {
        <a [routerLink]="link.path" (click)="closeMenu()" [style.--i]="i">
          <span class="zp-menu-num">{{ i < 9 ? '0' : '' }}{{ i + 1 }}</span>
          <span class="zp-menu-label">{{ link.label }}</span>
        </a>
      }
    </nav>
    <div class="zp-menu-foot">
      <a [href]="site.whatsappHref" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a [href]="site.phoneHref">{{ site.phoneDisplay }}</a>
      <a [href]="'mailto:' + site.email">{{ site.email }}</a>
    </div>
  </div>
</div>

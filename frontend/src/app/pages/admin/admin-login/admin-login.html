<div class="al-page">
  <div class="al-card">
    <img src="logo.png" alt="Zeilan Paradise" class="al-logo" width="400" height="341" />
    <p class="eyebrow">Admin</p>
    <h1>Welcome back</h1>
    <p class="al-sub">Sign in to see your enquiries.</p>

    <form (ngSubmit)="onSubmit()" novalidate>
      @if (errorMessage()) {
        <div class="al-error" role="alert">{{ errorMessage() }}</div>
      }

      <label class="al-field">
        <span>Username</span>
        <input type="text" name="username" [(ngModel)]="credentials.username" required autocomplete="username"
               autocapitalize="none" spellcheck="false" />
      </label>

      <label class="al-field">
        <span>Password</span>
        <input type="password" name="password" [(ngModel)]="credentials.password" required autocomplete="current-password" />
      </label>

      <button type="submit" class="btn btn-teal btn-lg al-submit" [disabled]="isLoading()">
        {{ isLoading() ? 'Signing in…' : 'Sign in' }}
      </button>
    </form>
  </div>
</div>

<div class="admin-login-page bg-pearl">
  <div class="admin-login-card">
    <div class="admin-login-header">
      <img src="logo.png" alt="Zeilan Paradise" class="admin-logo" />
      <h2>Admin Portal</h2>
      <p>Secure access to the Zeilan Paradise dashboard.</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="admin-login-form">
      <div *ngIf="errorMessage" class="admin-error">
        {{ errorMessage }}
      </div>

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input type="text" id="username" name="username" 
          [(ngModel)]="credentials.username" required 
          class="form-input" autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" name="password" 
          [(ngModel)]="credentials.password" required 
          class="form-input" autocomplete="current-password" />
      </div>

      <button type="submit" class="btn btn-teal btn-lg w-100 mt-4" [disabled]="isLoading">
        <span *ngIf="!isLoading">Sign In</span>
        <span *ngIf="isLoading">Authenticating...</span>
      </button>
    </form>
  </div>
</div>

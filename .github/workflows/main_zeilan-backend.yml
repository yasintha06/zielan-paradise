name: Deploy website + API to Azure App Service

# One App Service (zeilan-backend) serves both the Angular website and the Flask API.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - '.github/workflows/main_zeilan-backend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build website
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test the API
        working-directory: backend
        env:
          MONGO_URI: mongodb://unused
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD: ci-test-password
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q -p no:cacheprovider tests

      - name: Bundle website into the backend package
        run: |
          rm -rf backend/static
          cp -r frontend/dist/frontend/browser backend/static
          pip install whitenoise==6.12.0 brotli
          python -m whitenoise.compress backend/static

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: zeilan-backend
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE }}
          package: backend
